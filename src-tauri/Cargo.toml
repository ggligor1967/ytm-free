[package]
name = "ytm-free"
version = "0.1.0"
description = "Personal YouTube Music - Free streaming with yt-dlp"
authors = ["Gabor"]
edition = "2021"

[lib]
name = "ytm_free_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ytm-free"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.10.1", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-wdio = { version = "=1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.2.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5"
regex = "1"
sha2 = "0.10"
once_cell = "1"
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
wdio = [
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver"
]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
